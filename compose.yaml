name: ticket-overlord

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket_overlord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket_overlord}
      POSTGRES_USER: ${POSTGRES_USER:-ticket_overlord}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ticket_overlord}:${POSTGRES_PASSWORD:-ticket_overlord}@postgres:5432/${POSTGRES_DB:-ticket_overlord}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:3001/]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:3000/]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true

volumes:
  postgres_data:
