name: ticket-overlord

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket_overlord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket_overlord}
      POSTGRES_USER: ${POSTGRES_USER:-ticket_overlord}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  postgres-test:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ticket_overlord_test
      POSTGRES_PASSWORD: ticket_overlord
      POSTGRES_USER: ticket_overlord
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    stop_grace_period: 10s

  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "no", --save, "", --maxmemory-policy, noeviction]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 15

  redis-test:
    image: redis:8-alpine
    command: [redis-server, --appendonly, "no", --save, "", --maxmemory-policy, noeviction]
    ports:
      - "${REDIS_TEST_PORT:-6380}:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-ticket_overlord}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-ticket_overlord_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, curl, --fail, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ticket_overlord}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ticket_overlord_secret}
      S3_BUCKET: ${S3_BUCKET:-ticket-overlord-events}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-ticket_overlord}:${POSTGRES_PASSWORD:-ticket_overlord}@postgres:5432/${POSTGRES_DB:-ticket_overlord}
      EMAIL_PROVIDER: console
      NODE_ENV: production
      PORT: 3001
      REDIS_URL: redis://redis:6379
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ticket_overlord}
      S3_BUCKET: ${S3_BUCKET:-ticket-overlord-events}
      S3_ENDPOINT_URL: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_PRESIGNED_URL_TTL_SECONDS: ${S3_PRESIGNED_URL_TTL_SECONDS:-900}
      S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINIO_PORT:-9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ticket_overlord_secret}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:3001/]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:3000/]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true

volumes:
  minio_data:
  postgres_data:
